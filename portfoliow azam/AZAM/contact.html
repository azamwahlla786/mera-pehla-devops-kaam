<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - VIP Portfolio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="contact-style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent px-lg-5 py-4">
        <a class="navbar-brand font-weight-bold" href="index.html">Port<span class="text-info">folio</span></a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>
                <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                <li class="nav-item active"><a class="nav-link text-info" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="container py-5">
        <div class="text-center mb-5">
            <h2 class="display-4 font-weight-bold text-white">Contact <span class="text-info">Me!</span></h2>
        </div>

        <div class="row align-items-center">
            <div class="col-lg-5 mb-5 mb-lg-0">
                <div class="contact-info text-white">
                    <div class="info-item d-flex align-items-center mb-4">
                        <div class="icon-box mr-3"><i class="fas fa-phone-alt"></i></div>
                        <div>
                            <p class="mb-0 text-muted">Phone Number</p>
                            <h5 class="font-weight-bold">+92 300 1234567</h5>
                        </div>
                    </div>
                    <div class="info-item d-flex align-items-center mb-4">
                        <div class="icon-box mr-3"><i class="fas fa-envelope"></i></div>
                        <div>
                            <p class="mb-0 text-muted">Email Address</p>
                            <h5 class="font-weight-bold">azam@example.com</h5>
                        </div>
                    </div>
                    <div class="info-item d-flex align-items-center mb-4">
                        <div class="icon-box mr-3"><i class="fas fa-map-marker-alt"></i></div>
                        <div>
                            <p class="mb-0 text-muted">Location</p>
                            <h5 class="font-weight-bold">Karachi, Pakistan</h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="contact-form-card p-4 p-md-5">
                    <form>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <input type="text" class="form-control custom-input" placeholder="Full Name">
                            </div>
                            <div class="form-group col-md-6">
                                <input type="email" class="form-control custom-input" placeholder="Email Address">
                            </div>
                        </div>
                        <div class="form-group">
                            <input type="text" class="form-control custom-input" placeholder="Subject">
                        </div>
                        <div class="form-group">
                            <textarea class="form-control custom-input" rows="5" placeholder="Your Message"></textarea>
                        </div>
                        <div class="text-right">
                            <button type="submit" class="btn btn-vip btn-lg px-5">Send Message</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
